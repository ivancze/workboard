{% comment %}
  Cycles System → Light → Dark (static/js/theme.js). The label is chosen by
  CSS from the root's data-theme, so it is right on the first paint.
{% endcomment %}
<button type="button" data-theme-toggle class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-text-muted transition-colors hover:bg-sunken hover:text-text">
  <span class="sr-only">Theme:</span>
  <svg class="hidden size-4 theme-system:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
  <svg class="hidden size-4 theme-light:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="hidden size-4 theme-dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <span class="hidden theme-system:inline">System</span>
  <span class="hidden theme-light:inline">Light</span>
  <span class="hidden theme-dark:inline">Dark</span>
</button>

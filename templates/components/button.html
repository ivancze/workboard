{% comment %}
  A button, or a link that looks like one when `href` is given. `label` is its
  text; `variant` is primary (the default), secondary or ghost; `type`
  defaults to submit.
{% endcomment %}
{% if href %}<a href="{{ href }}"{% else %}<button type="{{ type|default:'submit' }}"{% endif %} class="inline-flex items-center justify-center gap-2 rounded-md px-3 py-2 text-sm font-semibold transition-colors {% if variant == 'secondary' %}border border-control bg-surface text-text hover:bg-sunken{% elif variant == 'ghost' %}text-text-muted hover:bg-sunken hover:text-text{% else %}bg-accent text-on-accent hover:bg-accent-hover{% endif %}">{{ label }}</{% if href %}a{% else %}button{% endif %}>

{% extends "base.html" %}

{% block title %}{{ board.name }} · Workboard{% endblock %}

{% block content %}
  <p><a href="{% url 'home' %}">← Your boards</a></p>
  <h1>{{ board.name }}</h1>

  <div>
    {% for stage in board.stages.all %}
      <section>
        <h2>{{ stage.name }}</h2>
        <p>No cards yet.</p>
      </section>
    {% endfor %}
  </div>
{% endblock %}
